<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数据库管理</title>
<style>
  :root {
    --bg: #f8fafc; --panel: #ffffff; --border: #e2e8f0; --text: #0f172a; --muted: #64748b;
    --accent: #2563eb; --accent-text: #ffffff; --hover: #f1f5f9; --error-bg: #fef2f2; --error: #b91c1c;
    --ok-bg: #f0fdf4; --ok: #15803d; --null: #94a3b8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f172a; --panel: #1e293b; --border: #334155; --text: #e2e8f0; --muted: #94a3b8;
      --accent: #3b82f6; --hover: #273449; --error-bg: #3b1d1d; --error: #fca5a5;
      --ok-bg: #14301f; --ok: #86efac; --null: #64748b;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 14px;
    display: flex; flex-direction: column;
  }
  header {
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 16px; }
  header .info { color: var(--muted); font-size: 12px; }
  .layout { flex: 1; display: flex; min-height: 0; }
  aside {
    width: 220px; flex-shrink: 0; background: var(--panel); border-right: 1px solid var(--border);
    overflow-y: auto; padding: 10px;
  }
  aside h2 {
    font-size: 12px; color: var(--muted); margin: 4px 6px 8px; font-weight: 600;
    display: flex; justify-content: space-between; align-items: center;
  }
  aside h2 button { font-size: 12px; padding: 2px 8px; }
  .table-item {
    display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left;
    padding: 7px 8px; border-radius: 6px; cursor: pointer; border: 0; background: none; color: var(--text);
    font: inherit;
  }
  .table-item:hover, .table-item.active { background: var(--hover); }
  .table-item.active { font-weight: 600; }
  .table-item .n { color: var(--muted); font-size: 12px; font-weight: 400; }
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; padding: 12px; gap: 10px; }
  textarea {
    width: 100%; height: 130px; resize: vertical; padding: 10px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; line-height: 1.5;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  button {
    font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); cursor: pointer;
  }
  button:hover { background: var(--hover); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button.primary:hover { filter: brightness(1.1); }
  button:disabled { opacity: .6; cursor: default; }
  .tip { color: var(--muted); font-size: 12px; }
  .msg { padding: 8px 12px; border-radius: 6px; font-size: 13px; white-space: pre-wrap; }
  .msg.ok { background: var(--ok-bg); color: var(--ok); }
  .msg.err { background: var(--error-bg); color: var(--error); font-family: ui-monospace, Menlo, Consolas, monospace; }
  .result {
    flex: 1; min-height: 120px; overflow: auto; background: var(--panel);
    border: 1px solid var(--border); border-radius: 8px;
  }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 6px 12px; text-align: left; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--hover); font-weight: 600; }
  td { max-width: 420px; overflow: hidden; text-overflow: ellipsis; }
  td.null { color: var(--null); font-style: italic; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .empty { padding: 30px; text-align: center; color: var(--muted); }
  @media (max-width: 640px) {
    .layout { flex-direction: column; }
    aside { width: auto; border-right: 0; border-bottom: 1px solid var(--border); max-height: 150px; }
  }
</style>
</head>
<body>
<header>
  <h1>数据库管理</h1>
  <span class="info" id="info">连接中…</span>
</header>
<div class="layout">
  <aside>
    <h2>数据表 <button id="refresh" title="刷新表列表">刷新</button></h2>
    <div id="tables"></div>
  </aside>
  <main>
    <textarea id="sql" spellcheck="false" placeholder="输入 SQL，例如：SELECT * FROM users;"></textarea>
    <div class="bar">
      <button class="primary" id="run">运行</button>
      <span class="tip">Ctrl / ⌘ + Enter 运行 · 点击左侧表名查看数据</span>
    </div>
    <div id="msg"></div>
    <div class="result" id="result"><div class="empty">运行查询后，结果显示在这里</div></div>
  </main>
</div>
<script>
const $ = id => document.getElementById(id);
const sqlEl = $('sql'), runBtn = $('run'), msgEl = $('msg'), resultEl = $('result'), tablesEl = $('tables');
let activeTable = null;

async function api(path, body) {
  const res = await fetch(path, body ? {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  } : undefined);
  const data = await res.json();
  if (!res.ok) throw Object.assign(new Error(data.error || '请求失败'), data);
  return data;
}

function quoteIdent(s) { return '"' + s.replace(/"/g, '""') + '"'; }

async function loadInfo() {
  try {
    const i = await api('/api/info');
    $('info').textContent = `数据库 ${i.db} · 用户 ${i.usr} · ${i.version.split(' on ')[0]}`;
  } catch (e) { $('info').textContent = '连接失败：' + e.message; }
}

async function loadTables() {
  try {
    const tables = await api('/api/tables');
    tablesEl.innerHTML = '';
    if (!tables.length) tablesEl.innerHTML = '<div class="empty">没有表</div>';
    tables.forEach(t => {
      const b = document.createElement('button');
      b.className = 'table-item' + (t.name === activeTable ? ' active' : '');
      const name = document.createElement('span'); name.textContent = t.name;
      const n = document.createElement('span'); n.className = 'n'; n.textContent = t.rows + ' 行';
      b.append(name, n);
      b.onclick = () => {
        activeTable = t.name;
        sqlEl.value = `SELECT * FROM ${quoteIdent(t.name)} LIMIT 100;`;
        run();
      };
      tablesEl.appendChild(b);
    });
  } catch (e) { tablesEl.innerHTML = ''; showMsg('err', '加载表列表失败：' + e.message); }
}

function showMsg(kind, text) {
  msgEl.innerHTML = '';
  if (!text) return;
  const d = document.createElement('div');
  d.className = 'msg ' + kind; d.textContent = text;
  msgEl.appendChild(d);
}

function render(r) {
  resultEl.innerHTML = '';
  if (!r.fields.length) {
    resultEl.innerHTML = '<div class="empty">语句已执行，没有返回数据</div>';
    return;
  }
  const table = document.createElement('table');
  const thead = table.createTHead().insertRow();
  r.fields.forEach(f => { const th = document.createElement('th'); th.textContent = f; thead.appendChild(th); });
  const tbody = table.createTBody();
  r.rows.forEach(row => {
    const tr = tbody.insertRow();
    row.forEach(v => {
      const td = tr.insertCell();
      if (v === null) { td.textContent = 'NULL'; td.className = 'null'; }
      else {
        const text = typeof v === 'object' ? JSON.stringify(v) : String(v);
        td.textContent = text; td.title = text;
        if (typeof v === 'number' || /^-?\d+(\.\d+)?$/.test(text)) td.className = 'num';
      }
    });
  });
  resultEl.appendChild(table);
  if (!r.rows.length) {
    const d = document.createElement('div'); d.className = 'empty'; d.textContent = '查询结果为空';
    resultEl.appendChild(d);
  }
}

async function run() {
  const sql = sqlEl.value.trim();
  if (!sql) return showMsg('err', '请先输入 SQL');
  runBtn.disabled = true; runBtn.textContent = '运行中…';
  try {
    const r = await api('/api/query', { sql });
    render(r);
    const isRead = r.fields.length > 0;
    let text = isRead ? `返回 ${r.rows.length} 行` : `${r.command} 成功，影响 ${r.rowCount ?? 0} 行`;
    if (r.truncated) text += `（结果太多，只显示前 ${r.rows.length} 行）`;
    showMsg('ok', `${text} · 耗时 ${r.ms} ms`);
    if (!/^\s*(select|show|explain|with)\b/i.test(sql)) loadTables(); // 可能改了数据，刷新行数
    else highlightActive();
  } catch (e) {
    showMsg('err', e.message + (e.hint ? '\n提示：' + e.hint : ''));
  } finally {
    runBtn.disabled = false; runBtn.textContent = '运行';
  }
}

function highlightActive() {
  tablesEl.querySelectorAll('.table-item').forEach(b => {
    b.classList.toggle('active', b.firstChild.textContent === activeTable);
  });
}

runBtn.onclick = run;
$('refresh').onclick = loadTables;
sqlEl.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); run(); }
});

loadInfo();
loadTables();
</script>
</body>
</html>
